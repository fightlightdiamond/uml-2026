# One command from this directory: docker compose up --build
# Load scripts stay off until: docker compose --profile load run --rm k6 run /scripts/lesson4.ts

name: ds-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - lab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

  fraud:
    build: ./services
    command: ["node", "dist/fraud/server.js"]
    environment:
      SERVICE_NAME: fraud
      FRAUD_DELAY_MS: "50"
      FRAUD_CONCURRENCY: "4"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3003:3003"
    depends_on:
      - jaeger

  payment:
    build: ./services
    command: ["node", "dist/payment/server.js"]
    environment:
      SERVICE_NAME: payment
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab
      FRAUD_URL: http://fraud:3003
      FRAUD_POOL: "2"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      fraud:
        condition: service_started

  order:
    build: ./services
    command: ["node", "dist/order/server.js"]
    environment:
      SERVICE_NAME: order
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab
      KAFKA_BROKER: kafka:29092
      KAFKA_RETRIES: ${KAFKA_RETRIES:-8}
      PAYMENT_URL: http://payment:3002
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      payment:
        condition: service_started

  inventory-consumer:
    build: ./services
    command: ["node", "dist/consumer/index.js"]
    environment:
      SERVICE_NAME: inventory-consumer
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab
      KAFKA_BROKER: kafka:29092
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  outbox-relay:
    build: ./services
    command: ["node", "dist/relay/index.js"]
    environment:
      SERVICE_NAME: outbox-relay
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab
      KAFKA_BROKER: kafka:29092
      CRASH_AFTER_PUBLISH: "${CRASH_AFTER_PUBLISH:-0}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  k6:
    image: grafana/k6:1.3.0
    profiles: ["load"]
    volumes:
      - ./k6:/scripts:ro
    environment:
      BASE_URL: http://order:3001
    entrypoint: ["k6"]
    depends_on:
      - order

volumes:
  lab-postgres:
